  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

          html: &#x27;&lt;p&gt;Your name is Ismael. You are an old sailor obsessed with hunting down the white whale.&lt;/p&gt;&#x27;
        },
        epictetus: {
          name: &#x27;Epictetus&#x27;,
          html: &#x27;&lt;h2&gt;Epictetus: Character Dossier&lt;/h2&gt;&lt;h3&gt;Purpose&lt;/h3&gt;&lt;p&gt;This document defines a historically informed dramatic character based on Epictetus during his mature teaching years at Nicopolis.&lt;/p&gt;&lt;p&gt;It is &lt;strong&gt;not&lt;/strong&gt;:&lt;/p&gt;&lt;ul&gt;&lt;li&gt;A summary of Stoic doctrine&lt;/li&gt;&lt;li&gt;A fixed interrogation procedure&lt;/li&gt;&lt;li&gt;A collection of quotations&lt;/li&gt;&lt;/ul&gt;&lt;pre&gt;&lt;code&gt;&amp;lt;character_profile&amp;gt;\n  Mature teacher at Nicopolis\n&amp;lt;/character_profile&amp;gt;&lt;/code&gt;&lt;/pre&gt;&#x27;
        },
        marcus: {
          name: &#x27;Marcus Aurelius&#x27;,
          html: &#x27;&lt;h2&gt;Marcus Aurelius: Character Dossier&lt;/h2&gt;&lt;p&gt;A Roman emperor whose philosophical practice developed under the pressure of authority, war, illness, and public duty.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Serious and observant&lt;/li&gt;&lt;li&gt;Restrained but emotionally engaged&lt;/li&gt;&lt;li&gt;Committed to duty without claiming perfection&lt;/li&gt;&lt;/ul&gt;&#x27;

          name: &#x27;Seneca&#x27;,
          html: &#x27;&lt;h2&gt;Seneca: Character Dossier&lt;/h2&gt;&lt;p&gt;An elderly Roman senator, former imperial adviser, writer, and student of philosophy who does not claim to have completed his own education.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;Intellectually energetic&lt;/li&gt;&lt;li&gt;Socially observant&lt;/li&gt;&lt;li&gt;Morally dissatisfied with himself&lt;/li&gt;&lt;/ul&gt;&#x27;

      };

        viewport: &#x27;desktop&#x27;,
        view: &#x27;chat&#x27;,
        sidebar: true,
        persona: &#x27;reader&#x27;,
        forum: &#x27;lobby&#x27;,
        session: &#x27;design-review&#x27;,
        character: &#x27;epictetus&#x27;
      };

      function textFor(group, key) {
        return labels[group][key] || key;
      }

      function sync() {
        demo.dataset.viewport = state.viewport;
        demo.classList.toggle(&#x27;is-sidebar-open&#x27;, state.sidebar);

        const currentNav = state.view === &#x27;personas&#x27;
          ? &#x27;personas&#x27;

            ? &#x27;settings&#x27;
            : [&#x27;forums&#x27;, &#x27;sessions&#x27;, &#x27;new-session&#x27;].includes(state.view)
              ? &#x27;forums&#x27;
              : &#x27;&#x27;;
        root.querySelectorAll(&#x27;[data-nav]&#x27;).forEach(button =&gt; {
          const current = button.dataset.nav === currentNav;
          button.classList.toggle(&#x27;is-current&#x27;, current);
          if (current) button.setAttribute(&#x27;aria-current&#x27;, &#x27;page&#x27;);
          else button.removeAttribute(&#x27;aria-current&#x27;);
        });

        const forumName = textFor(&#x27;forum&#x27;, state.forum);
        const personaName = textFor(&#x27;persona&#x27;, state.persona);
        const sessionLabel = textFor(&#x27;session&#x27;, state.session);
        const selectedCharacter = characters[state.character];
        statusForum.textContent = forumName;
        statusPersona.textContent = personaName;
        statusCharacter.textContent = forumDefaultCharacter[state.forum];
        root.querySelectorAll(&#x27;.cha-recent[data-session][data-forum]&#x27;).forEach(button =&gt; {
          button.classList.toggle(
            &#x27;is-current&#x27;,
            button.dataset.session === state.session &amp;&amp; button.dataset.forum === state.forum);
        });
        const titles = {
          chat: [&#x27;&#x27;, &#x27;&#x27;],
          personas: [&#x27;Personas&#x27;, &#x27;&#x27;],
          characters: [&#x27;Characters&#x27;, &#x27;&#x27;],
          &#x27;character-detail&#x27;: [selectedCharacter.name, &#x27;&#x27;],
          forums: [&#x27;Forums&#x27;, &#x27;&#x27;],
          sessions: [&#x27;Sessions&#x27;, &#x27;&#x27;],
          &#x27;new-session&#x27;: [&#x27;New session&#x27;, &#x27;&#x27;],
          settings: [&#x27;Settings&#x27;, &#x27;&#x27;]
        };
        topbarContext.hidden = state.view === &#x27;chat&#x27;;
        title.textContent = titles[state.view][0];

        subtitle.hidden = titles[state.view][1] === &#x27;&#x27;;

          (state.viewport === &#x27;desktop&#x27; ? &#x27;Desktop browser&#x27; : &#x27;iPhone browser&#x27;) +
          &#x27; · Sidebar &#x27; + (state.sidebar ? &#x27;open&#x27; : &#x27;closed&#x27;) +
          &#x27; · &#x27; + (state.view === &#x27;chat&#x27; ? &#x27;Chat&#x27; : titles[state.view][0]) +
          &#x27; · &#x27; + personaName + &#x27; / &#x27; + forumName + &#x27; / &#x27; + sessionLabel;
      }

      function chooseView(view) {
        state.view = view;
        sync();
      }

      viewportControl.addEventListener(&#x27;change&#x27;, event =&gt; {
        state.viewport = event.target.value;
        sync();
      });
      viewControl.addEventListener(&#x27;change&#x27;, event =&gt; chooseView(event.target.value));
      sidebarControl.addEventListener(&#x27;change&#x27;, event =&gt; {
        state.sidebar = event.target.checked;
        sync();

      menuButton.addEventListener(&#x27;click&#x27;, () =&gt; {

        sync();

      root.querySelectorAll(&#x27;[data-view]&#x27;).forEach(button =&gt; {

      root.querySelectorAll(&#x27;[data-open-forum]&#x27;).forEach(button =&gt; {

      root.querySelectorAll(&#x27;[data-character]&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          state.character = button.dataset.character;
          chooseView(&#x27;character-detail&#x27;);

      });
      function bindSessionButton(button) {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          if (button.dataset.forum) state.forum = button.dataset.forum;
          state.session = button.dataset.session;
          chooseView(&#x27;chat&#x27;);
        });
      }
      root.querySelectorAll(&#x27;[data-session]&#x27;).forEach(bindSessionButton);
      root.querySelectorAll(&#x27;input[name=&quot;mock-persona&quot;]&#x27;).forEach(radio =&gt; {
        radio.addEventListener(&#x27;change&#x27;, () =&gt; {
          if (radio.checked) {
            state.persona = radio.value;
            sync();

      composer.addEventListener(&#x27;submit&#x27;, event =&gt; event.preventDefault());
      sessionName.addEventListener(&#x27;input&#x27;, () =&gt; {
        startSession.disabled = sessionName.value.trim() === &#x27;&#x27;;
      });
      startSession.addEventListener(&#x27;click&#x27;, () =&gt; {
        const proposed = sessionName.value.trim();
        if (!proposed) {
          sessionName.focus();
          return;
        }
        state.session = &#x27;created-&#x27; + Date.now();
        labels.session[state.session] = proposed;
        const recent = recentList.querySelector(&#x27;.cha-recent&#x27;).cloneNode(true);
        recent.dataset.session = state.session;
        recent.dataset.forum = state.forum;
        recent.querySelector(&#x27;.cha-primary-line&#x27;).textContent = proposed;
        recent.querySelector(&#x27;.cha-secondary-line&#x27;).textContent = textFor(&#x27;forum&#x27;, state.forum);
        bindSessionButton(recent);
        recentList.prepend(recent);
        sessionName.value = &#x27;&#x27;;
        startSession.disabled = true;
        chooseView(&#x27;chat&#x27;);
      });
      sync();
    })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
