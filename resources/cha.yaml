openapi: 3.1.0
info:
  title: CHA Web API
  version: 1.0.0
  description: |
    HTTP and server-sent event interface exposed by `chaweb`.

    `/` and `/s/{forum_id}/{session_id}/` serve the same client-routed HTML
    shell. Discovery and stored-session operations use root-scoped `/api/v1`
    routes. Operations on an open session are scoped beneath
    `/s/{forum_id}/{session_id}/api/v1`.

    The API has no authentication mechanism. Transcript attribution uses the
    session's current persona, which starts as its forum's configured one and
    changes only through the `/!Name` chat command. JSON mutations that include an `Origin`
    header require that origin's authority to equal `Host`.
servers:
  - url: http://{host}:{port}
    description: Locally configured CHA web listener
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8080"

tags:
  - name: Shell
  - name: Service
  - name: Discovery
  - name: Stored sessions
  - name: Live sessions

paths:
  /:
    get:
      tags: [Shell]
      operationId: getShell
      summary: Get the browser application shell
      description: |
        Returns the single client-routed HTML document. The browser loads its
        state from `/api/v1/bootstrap` and routes between conversations itself
        without requesting another document.
      responses:
        "200":
          $ref: "#/components/responses/Shell"
        "500":
          $ref: "#/components/responses/InternalError"

  /s/{forum_id}/{session_id}/:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Shell]
      operationId: getSessionShell
      summary: Get the shell for a session deep link
      description: |
        Returns the same document as `/`. The trailing slash is required.

        The identifiers are neither validated nor resolved here: an unknown,
        malformed, or unopened session still receives the shell with status 200.
        The browser reads them from its own location and opens the session
        through `POST /api/v1/forums/{forum_id}/sessions/{session_id}/open`.
      responses:
        "200":
          $ref: "#/components/responses/Shell"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check service readiness
      responses:
        "200":
          description: The server is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/bootstrap:
    get:
      tags: [Discovery]
      operationId: getBootstrap
      summary: Get initial navigation and discovery state
      description: |
        Returns the initial forum and character rosters, including each forum's
        fixed persona, and all recent sessions ordered newest first.

        The character and forum rosters come from the published workspace
        generation, so added or removed characters, personas, and forums appear
        only after `POST /api/v1/workspace/reload`. Sessions are read from
        storage on every request, so `recent_sessions` includes sessions created
        since that generation was published.
      responses:
        "200":
          description: Bootstrap state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/workspace/reload:
    post:
      tags: [Discovery]
      operationId: reloadWorkspace
      summary: Re-read the workspace and publish a new generation
      description: |
        Re-reads the whole workspace from disk and publishes it as a new
        generation, which is how added or removed characters, personas, and
        forums — and edited provider config files — reach discovery.

        The replacement is built and validated in full before it is published,
        so a workspace that does not load answers `422` with
        `workspace_reload_failed` and leaves the current generation and its live
        sessions untouched.

        After a successful publish the server asks every starting or running
        session to shut down with `workspace_reloading`; it does not reopen
        anything. The temporary Welcome session belongs to the generation that
        created it, so its conversation does not survive a reload. Stored
        sessions are untouched on disk.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          description: Bootstrap state of the newly published generation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          description: |
            The workspace could not be loaded. `error.code` is
            `workspace_reload_failed` and `error.message` carries the validation
            failure. The published generation is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/characters/{character_id}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    get:
      tags: [Discovery]
      operationId: getCharacter
      summary: Get character details
      description: |
        Returns the character summary, its template-expanded Markdown
        definition, and the provider/style settings the editor needs. The
        built-in Assistant returns the embedded application guide and is not
        writable.
      responses:
        "200":
          description: Character details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Discovery]
      operationId: updateCharacter
      summary: Update a character's provider and style
      description: |
        Rewrites `provider` and `style` in the character's `character.toml`.
        `null` erases the key. A name whose config does not load is `400` and
        leaves the file untouched. The built-in Assistant, a missing character,
        and a character whose file cannot be read are `404`.

        After a write that actually changes a value, the server asks live
        sessions the change can affect to shut down with `reloading`. A
        provider-only save does not restart sessions in forums that override
        the provider. The server does not reopen anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCharacterRequest"
      responses:
        "200":
          description: Character details after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/personas/{persona_id}:
    parameters:
      - $ref: "#/components/parameters/PersonaId"
    get:
      tags: [Discovery]
      operationId: getPersona
      summary: Get persona details
      description: |
        Returns the persona summary and its `PERSONA.md` description verbatim.
        `persona_markdown` is empty for a persona that configures none.
      responses:
        "200":
          description: Persona details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonaDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/forums/{forum_id}:
    parameters:
      - $ref: "#/components/parameters/ForumId"
    get:
      tags: [Discovery]
      operationId: getForum
      summary: Get forum details
      description: |
        Returns the forum summary and its `FORUM.md` verbatim. That file is
        also the forum's system prompt, and is published whole by design.
        Template placeholders such as `$${character.display_name}` are not
        expanded, because a description belongs to no single member.
        `forum_markdown` is empty for a forum that has no `FORUM.md`, including
        the built-in Entrance.
      responses:
        "200":
          description: Forum details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/forums/{forum_id}/sessions:
    parameters:
      - $ref: "#/components/parameters/ForumId"
    get:
      tags: [Stored sessions]
      operationId: listSessions
      summary: List a forum's sessions
      description: |
        Lists stored sessions and whether each has a live runtime. The built-in
        Entrance forum returns only its process-local Welcome session.
      responses:
        "200":
          description: Session list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionListing"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Stored sessions]
      operationId: createSession
      summary: Create a stored session
      description: |
        Creates the session without opening a live runtime for it. The label is
        stored as given; an empty label is replaced by the generated session ID,
        so the returned label may differ from the requested one.

        A non-empty label must be valid UTF-8, contain at most 200 Unicode code
        points, contain no control characters or line breaks, and have no
        leading or trailing Unicode whitespace. Invalid labels answer `400`
        with `bad_request`.

        Only workspace forums accept creation. The built-in Entrance forum has no
        workspace directory, so creating a session in it answers `404` with
        `not_found`; its Welcome session is the only session it ever lists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/forums/{forum_id}/sessions/{session_id}/open:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Stored sessions]
      operationId: openSession
      summary: Open or reattach to a session
      description: |
        Starts the session's live runtime, or reattaches to its existing runtime.
        On success, live-session operations become available beneath the session's
        `/s/{forum_id}/{session_id}/api/v1` path.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          description: Session is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenSessionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The session is busy or stopping. `error.code` is `session_busy` when
            its storage lease is held by another CHA process,
            or `session_stopping` while its previous runtime is still shutting
            down. Both are retryable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            Session limit, open timeout, or server shutdown prevented opening.
            `error.code` is `session_limit_reached`, `session_open_timeout`, or
            `server_stopping`. On `session_open_timeout` the session may still
            finish opening, so the request can be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/forums/{forum_id}/sessions/{session_id}/download:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Stored sessions]
      operationId: downloadSession
      summary: Download a session transcript as Markdown
      description: |
        Returns the current transcript of a stored or live session. A live
        session is read through its owner so the export includes its latest
        in-memory content without changing which session the browser has open.
      responses:
        "200":
          description: Markdown session transcript.
          content:
            text/markdown:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The stored session is busy or the live session stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The session command timed out or its queue was full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/forums/{forum_id}/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    patch:
      tags: [Stored sessions]
      operationId: renameSession
      summary: Rename a stored or live session
      description: |
        Replaces the session's display label. The stable session ID never
        changes, so existing deep links stay valid.

        The label must be valid UTF-8, contain at most 200 Unicode code points,
        contain no control characters or line breaks, and have no leading or
        trailing Unicode whitespace. Unlike creation, an empty label has no
        generated-ID fallback and answers `400` with `bad_request`.

        A session with a live runtime is renamed through its owner, so the
        database, the current snapshot, and every event-stream consumer observe
        the same label. That path also reports the owner-queue failures:
        `command_queue_full`, `command_timeout`, and `session_not_live`. A
        `command_timeout` leaves the outcome unknown, because the owner may
        still commit the rename after the request has given up.

        A session without a live runtime is renamed through storage, where
        another process holding its lease answers `409` with `session_busy`.

        The built-in Welcome session is process-local and cannot be renamed; it
        answers `404` with `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSessionRequest"
      responses:
        "200":
          description: Session renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLabelResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session is busy or no longer live.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"
    delete:
      tags: [Stored sessions]
      operationId: deleteSession
      summary: Move a session into recoverable deleted storage
      description: |
        Removes the session from CHA without erasing it. Its database is moved
        into the forum's `deleted/` directory, so the session stops listing,
        stops opening, and answers `404` afterwards, while its transcript
        remains on disk for an operator. The browser can neither list nor
        restore it.

        A session with a live runtime is stopped first, and its final snapshot
        carries the `session_deleted` shutdown reason. If that shutdown does not
        finish within the server's deletion deadline the database is left in the
        ordinary catalog and the request answers `409` with `session_stopping`;
        the shutdown may still complete, so a later delete can succeed.

        The move never replaces a file already at the destination. That
        collision answers `409` with `session_delete_conflict` and leaves both
        the active session and the retained database untouched.

        Deletion deliberately does not require readable session metadata, so a
        corrupt database can still be removed from the catalog.

        The built-in Welcome session is process-local and cannot be deleted; it
        answers `404` with `not_found` without stopping its runtime.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Session moved to deleted storage.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session is busy, stopping, or its archive destination exists.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Server shutdown prevented deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /s/{forum_id}/{session_id}/api/v1/session:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Live sessions]
      operationId: getSessionSnapshot
      summary: Get the authoritative live-session snapshot
      responses:
        "200":
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/events:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Live sessions]
      operationId: streamSessionEvents
      summary: Stream live-session updates
      description: |
        Opens the session's single allowed Server-Sent Events connection.
        The first record is a `snapshot` event whose JSON data is a
        `SessionSnapshot`. Later records are either replacement `snapshot`
        events or `append` events whose JSON data is an `AppendEvent`.
        Comment-only `: heartbeat` records keep an idle connection alive.

        `Last-Event-ID` is ignored; reconnecting starts with a fresh snapshot.
      responses:
        "200":
          description: |
            SSE stream containing `snapshot` and `append` events. Event data is
            one compact JSON value on the `data:` line.
          x-sse-events:
            snapshot:
              payload:
                $ref: "#/components/schemas/SessionSnapshot"
            append:
              payload:
                $ref: "#/components/schemas/AppendEvent"
            heartbeat:
              description: "Comment-only `: heartbeat` record with no data payload."
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                const: "no"
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                snapshot:
                  summary: Initial event shape
                  value: |-
                    event: snapshot
                    data: {"forum":{"id":"lobby","display_name":"Lobby","default_character_id":"guide","default_persona_id":"builtin-guest","default_persona_display_name":"Guest","members":[]},"session_id":"one","session_label":"One","characters":[],"default_character_id":"guide","transcript":[],"generation":{"active":false,"character_id":"","character_display_name":"","phase":"waiting","reasoning_text":""},"lifecycle":"running"}
                append:
                  summary: Incremental transcript append
                  value: |-
                    event: append
                    data: {"target":{"kind":"entry","entry_id":1},"text":" more text","seq":0}

        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Session is not live or already has an event stream. `error.code` is
            `session_not_live`, or `browser_stream_in_use` when the session's one
            allowed connection is already held by another browser page.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/input:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Live sessions]
      operationId: submitInput
      summary: Submit user input
      description: |
        Submits text through the session's shared input path using the fixed
        persona configured for the session's forum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputRequest"
      responses:
        "200":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "413":
          description: |
            Request body or prompt text exceeds its configured limit.
            `error.code` is `body_too_large` for the whole request body, or
            `prompt_too_large` for the `text` field alone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/actions/stop:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Live sessions]
      operationId: stopGeneration
      summary: Request that generation stop
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/actions/default-character:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Live sessions]
      operationId: setDefaultCharacter
      summary: Change and save the forum's default character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultCharacterRequest"
      responses:
        "200":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

components:
  parameters:
    ForumId:
      name: forum_id
      in: path
      required: true
      description: Stable URL-safe forum identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    SessionId:
      name: session_id
      in: path
      required: true
      description: Stable URL-safe session identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    CharacterId:
      name: character_id
      in: path
      required: true
      description: Stable URL-safe character identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: Stable URL-safe persona identifier.
      schema:
        $ref: "#/components/schemas/Identifier"

  requestBodies:
    EmptyJsonObject:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyObject"

  responses:
    BadRequest:
      description: |
        Content type is not JSON, or the JSON body has an invalid shape.
        `error.code` is `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenMutation:
      description: |
        Origin does not match Host. `error.code` is `forbidden_origin`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        The route identifier or selected resource was not found.
        `error.code` is `not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SessionNotLive:
      description: |
        The selected session does not have a live runtime.
        `error.code` is `session_not_live`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BodyTooLarge:
      description: |
        The JSON request body exceeds the configured size limit.
        `error.code` is `body_too_large`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: |
        The request failed unexpectedly.
        `error.code` is `internal_error`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Shell:
      description: The client-routed application document, served as UTF-8 HTML.
      content:
        text/html:
          schema:
            type: string
    CommandUnavailable:
      description: |
        The command queue is full, the command timed out, or the server is
        stopping. `error.code` is `command_queue_full`, `command_timeout`, or
        `server_stopping`. On `command_timeout` the command's outcome is
        unknown: it may still be applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CommandAccepted:
      description: Command completed at the live-session boundary.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandResult"

  schemas:
    Identifier:
      type: string
      minLength: 1
      pattern: "^(?!\\.{1,2}$)[A-Za-z0-9._~-]+$"
      examples: [lobby]

    EmptyObject:
      type: object
      additionalProperties: false

    Health:
      type: object
      additionalProperties: false
      required: [ready, live_session_count]
      properties:
        ready:
          type: boolean
          const: true
        live_session_count:
          type: integer
          minimum: 0

    PersonaSummary:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string

    CharacterAppearance:
      type: object
      additionalProperties: false
      description: |
        How the browser sets this character's words, so a reader can tell one
        speaker from another without reading every name. A closed vocabulary:
        the browser owns the actual typefaces, sizes, and colors and pairs each choice
        with a dark-mode variant, and a workspace cannot supply styling of its
        own. Always present, defaults included.
      required: [font, style, weight, size, text_color]
      properties:
        font:
          type: string
          enum: [sans, serif, mono]
        style:
          type: string
          enum: [normal, italic]
        weight:
          type: string
          enum: [light, normal, medium, semibold, bold]
        size:
          type: string
          enum: [small, normal, large]
        text_color:
          type: string
          enum: [normal, muted, accent]

    CharacterSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, appearance]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        appearance:
          $ref: "#/components/schemas/CharacterAppearance"

    ForumSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, default_character_id, default_persona_id, default_persona_display_name, members]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        default_character_id:
          $ref: "#/components/schemas/Identifier"
        default_persona_id:
          $ref: "#/components/schemas/Identifier"
        default_persona_display_name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"

    SessionListing:
      type: object
      additionalProperties: false
      required: [id, label, live, updated_at]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string
        live:
          type: boolean
        updated_at:
          $ref: "#/components/schemas/UnixTimestamp"

    RecentSession:
      type: object
      additionalProperties: false
      required: [forum_id, session_id, session_label, updated_at]
      properties:
        forum_id:
          $ref: "#/components/schemas/Identifier"
        session_id:
          $ref: "#/components/schemas/Identifier"
        session_label:
          type: string
        updated_at:
          $ref: "#/components/schemas/UnixTimestamp"

    Bootstrap:
      type: object
      additionalProperties: false
      required:
        - initial_forum_id
        - initial_session_id
        - personas
        - characters
        - forums
        - recent_sessions
      properties:
        initial_forum_id:
          $ref: "#/components/schemas/Identifier"
        initial_session_id:
          $ref: "#/components/schemas/Identifier"
        personas:
          type: array
          items:
            $ref: "#/components/schemas/PersonaSummary"
        characters:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"
        forums:
          type: array
          items:
            $ref: "#/components/schemas/ForumSummary"
        recent_sessions:
          type: array
          description: All sessions ordered by `updated_at` descending.
          items:
            $ref: "#/components/schemas/RecentSession"

    ProviderOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string

    StyleOption:
      type: object
      additionalProperties: false
      required: [id, label, appearance]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string
        appearance:
          $ref: "#/components/schemas/CharacterAppearance"

    CharacterDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - appearance
        - character_markdown
        - provider
        - style
        - available_providers
        - available_styles
        - provider_overridden_by
        - writable
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        appearance:
          $ref: "#/components/schemas/CharacterAppearance"
        character_markdown:
          type: string
        provider:
          type: [string, "null"]
        style:
          type: [string, "null"]
        available_providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderOption"
        available_styles:
          type: array
          items:
            $ref: "#/components/schemas/StyleOption"
        provider_overridden_by:
          type: array
          items:
            type: string
        writable:
          type: boolean

    UpdateCharacterRequest:
      type: object
      additionalProperties: false
      required: [provider, style]
      properties:
        provider:
          type: [string, "null"]
        style:
          type: [string, "null"]

    PersonaDetail:
      type: object
      additionalProperties: false
      required: [id, display_name, persona_markdown]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        persona_markdown:
          type: string

    ForumDetail:
      type: object
      additionalProperties: false
      required: [id, display_name, default_character_id, default_persona_id, default_persona_display_name, members, forum_markdown]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        default_character_id:
          $ref: "#/components/schemas/Identifier"
        default_persona_id:
          $ref: "#/components/schemas/Identifier"
        default_persona_display_name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"
        forum_markdown:
          type: string

    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          maxLength: 200

    RenameSessionRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200

    CreateSessionResult:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string

    SessionLabelResult:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string

    OpenSessionResult:
      type: object
      additionalProperties: false
      required: [forum_id, session_id]
      properties:
        forum_id:
          $ref: "#/components/schemas/Identifier"
        session_id:
          $ref: "#/components/schemas/Identifier"

    InputRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: Input text, limited by the server's configured prompt byte limit.

    SetDefaultCharacterRequest:
      type: object
      additionalProperties: false
      required: [character_id]
      properties:
        character_id:
          type: string
          minLength: 1

    CommandResult:
      type: object
      additionalProperties: false
      required: [clear_input]
      properties:
        clear_input:
          type: boolean
        notice:
          type: string

    TranscriptEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - participant_id
        - display_name
        - addressed_to
        - addressed_to_name
        - text
        - status
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UnsignedInteger"
        kind:
          type: string
          enum: [human, character, notice, error]
        participant_id:
          type: string
        display_name:
          type: string
        addressed_to:
          type: string
        addressed_to_name:
          type: string
        text:
          type: string
        status:
          type: string
          enum: [complete, streaming, cancelled, failed]
        request_id:
          $ref: "#/components/schemas/UnsignedInteger"
        created_at:
          description: Unix seconds when the entry was created; null when unknown (rows stored before schema version 3).
          type: [integer, "null"]

    GenerationState:
      type: object
      additionalProperties: false
      required: [active, character_id, character_display_name, phase, reasoning_text]
      properties:
        active:
          type: boolean
        request_id:
          $ref: "#/components/schemas/UnsignedInteger"
        character_id:
          type: string
        character_display_name:
          type: string
        phase:
          type: string
          enum: [waiting, reasoning, answering, stopping]
        reasoning_text:
          type: string

    SessionSnapshot:
      type: object
      additionalProperties: false
      required:
        - forum
        - session_id
        - session_label
        - characters
        - default_character_id
        - transcript
        - generation
        - lifecycle
      properties:
        forum:
          $ref: "#/components/schemas/ForumSummary"
        session_id:
          $ref: "#/components/schemas/Identifier"
        session_label:
          type: string
        characters:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"
        default_character_id:
          $ref: "#/components/schemas/Identifier"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        generation:
          $ref: "#/components/schemas/GenerationState"
        notice:
          type: string
        lifecycle:
          type: string
          enum: [starting, running, stopping]
        shutdown_reason:
          type: string
          enum: [browser_disconnected, reloading, workspace_reloading, session_failed, session_deleted, server_stopping]

    AppendTargetEntry:
      type: object
      additionalProperties: false
      required: [kind, entry_id]
      properties:
        kind:
          type: string
          const: entry
        entry_id:
          $ref: "#/components/schemas/UnsignedInteger"

    AppendTargetReasoning:
      type: object
      additionalProperties: false
      required: [kind, request_id]
      properties:
        kind:
          type: string
          const: reasoning
        request_id:
          $ref: "#/components/schemas/UnsignedInteger"

    AppendTarget:
      oneOf:
        - $ref: "#/components/schemas/AppendTargetEntry"
        - $ref: "#/components/schemas/AppendTargetReasoning"
      discriminator:
        propertyName: kind
        mapping:
          entry: "#/components/schemas/AppendTargetEntry"
          reasoning: "#/components/schemas/AppendTargetReasoning"

    AppendEvent:
      type: object
      additionalProperties: false
      required: [target, text, seq]
      properties:
        target:
          $ref: "#/components/schemas/AppendTarget"
        text:
          type: string
        seq:
          $ref: "#/components/schemas/UnsignedInteger"

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - not_found
                - bad_request
                - body_too_large
                - prompt_too_large
                - forbidden_origin
                - internal_error
                - session_busy
                - session_stopping
                - session_limit_reached
                - session_open_timeout
                - server_stopping
                - session_not_live
                - browser_stream_in_use
                - command_timeout
                - command_queue_full
                - session_delete_conflict
                - workspace_reload_failed
            message:
              type: string

    UnixTimestamp:
      type: integer
      format: int64
      description: Whole seconds since the Unix epoch.

    UnsignedInteger:
      type: integer
      minimum: 0
