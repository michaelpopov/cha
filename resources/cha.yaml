    post:
      tags: [Live sessions]
      operationId: setDefaultCharacter
      summary: Change and save the forum's default character
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetDefaultCharacterRequest"
      responses:
        "200":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

components:
  parameters:
    ForumId:
      name: forum_id
      in: path
      required: true
      description: Stable URL-safe forum identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    SessionId:
      name: session_id
      in: path
      required: true
      description: Stable URL-safe session identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    CharacterId:
      name: character_id
      in: path
      required: true
      description: Stable URL-safe character identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: Stable URL-safe persona identifier.
      schema:
        $ref: "#/components/schemas/Identifier"

  requestBodies:
    EmptyJsonObject:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyObject"

  responses:
    BadRequest:
      description: |
        Content type is not JSON, or the JSON body has an invalid shape.
        `error.code` is `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenMutation:
      description: |
        Origin does not match Host. `error.code` is `forbidden_origin`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        The route identifier or selected resource was not found.
        `error.code` is `not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SessionNotLive:
      description: |
        The selected session does not have a live runtime.
        `error.code` is `session_not_live`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BodyTooLarge:
      description: |
        The JSON request body exceeds the configured size limit.
        `error.code` is `body_too_large`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: |
        The request failed unexpectedly.
        `error.code` is `internal_error`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SourceVaultPasswordRequired:
      description: |
        The source vault is password-protected and the supplied password is
        missing or incorrect. `error.code` is
        `source_vault_password_required`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Shell:
      description: The client-routed application document, served as UTF-8 HTML.
      content:
        text/html:
          schema:
            type: string
    CommandUnavailable:
      description: |
        The command queue is full, the command timed out, or the server is
        stopping. `error.code` is `command_queue_full`, `command_timeout`, or
        `server_stopping`. On `command_timeout` the command's outcome is
        unknown: it may still be applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CommandAccepted:
      description: Command completed at the live-session boundary.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandResult"
    OpenAiAuth:
      description: |
        Displayable ChatGPT connection snapshot. Waiting is the only status
        that includes a user code, verification URL, attempt expiry, and
        next-poll delay.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAiAuth"
          examples:
            signed_out:
              summary: No ChatGPT account is connected
              value:
                status: signed_out
            waiting:
              summary: Device login in progress
              value:
                status: waiting
                user_code: TEST-ONLY
                verification_url: https://auth.openai.com/codex/device
                attempt_expires_at: 1700000900
                next_poll_delay_ms: 1000
            connected:
              summary: ChatGPT account is connected
              value:
                status: connected
            signed_out_with_error:
              summary: Login failed; reconnect is manual
              value:
                status: signed_out
                error: OpenAI login failed.

