openapi: 3.1.0
info:
  title: CHA Web API
  version: 1.0.0
  description: |
    Temporary HTTP and server-sent event catalog for `chaweb`.
    Application DTOs and native envelopes live in `dto.yaml`; this file
    references those definitions instead of copying them.

    `/` and `/s/{forum_id}/{session_id}/` serve the same client-routed HTML
    shell. Discovery and stored-session operations use root-scoped `/api/v1`
    routes. Operations on an open session are scoped beneath
    `/s/{forum_id}/{session_id}/api/v1`.

    The API has no authentication mechanism. Transcript attribution uses the
    session's persona, which comes from its forum configuration. JSON mutations
    that include an `Origin` header require that origin's authority to equal
    `Host`.
servers:
  - url: http://{host}:{port}
    description: Locally configured CHA web listener
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8080"

tags:
  - name: Shell
  - name: Service
  - name: Discovery
  - name: Settings
  - name: OpenAI
  - name: Stored sessions
  - name: Live sessions

paths:
  /:
    get:
      tags: [Shell]
      operationId: getShell
      summary: Get the browser application shell
      description: |
        Returns the single client-routed HTML document. The browser loads its
        state from `/api/v1/bootstrap` and routes between conversations itself
        without requesting another document.
      responses:
        "200":
          $ref: "#/components/responses/Shell"
        "500":
          $ref: "#/components/responses/InternalError"

  /s/{forum_id}/{session_id}/:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Shell]
      operationId: getSessionShell
      summary: Get the shell for a session deep link
      description: |
        Returns the same document as `/`. The trailing slash is required.

        The identifiers are neither validated nor resolved here: an unknown,
        malformed, or unopened session still receives the shell with status 200.
        The browser reads them from its own location and opens the session
        through `POST /api/v1/forums/{forum_id}/sessions/{session_id}/open`.
      responses:
        "200":
          $ref: "#/components/responses/Shell"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check service readiness
      responses:
        "200":
          description: The server is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/bootstrap:
    get:
      tags: [Discovery]
      operationId: getBootstrap
      summary: Get initial navigation and discovery state
      description: |
        Returns the initial forum and character rosters, including each forum's
        fixed persona, and all recent sessions ordered newest first.

        The character and forum rosters come from the published workspace.
        Sessions are read from storage on every request, so `recent_sessions`
        includes sessions created after the workspace was published.
      responses:
        "200":
          description: Bootstrap state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vault/switch:
    post:
      tags: [Service]
      operationId: switchVault
      summary: Switch the active vault
      description: |
        Switches the shared process-wide vault. The name is matched
        ASCII-case-insensitively against the configured registry. Success is
        `204` after the operation completes, including when the requested
        vault is already active. The HTTP listener and port do not change.

        After success the initiating page reloads `/` in the target vault.
        `Cache-Control` is `no-store`, including error responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultSwitchRequest"
      responses:
        "204":
          description: The vault is now the requested vault, or already was.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vault/merge:
    post:
      tags: [Settings]
      operationId: mergeVault
      summary: Merge a source vault into the active vault
      description: |
        Overlays stored workspace configuration from the named source vault
        onto the active destination vault by exact path. The active vault,
        vault registry, and both protection settings are unchanged. Source
        sessions are not copied.

        Success is `204` with no body. `Cache-Control` is `no-store`,
        including error responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MergeVaultRequest"
      responses:
        "204":
          description: The source configuration was merged into the active vault.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/SourceVaultPasswordRequired"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vaults:
    get:
      tags: [Settings]
      operationId: listVaults
      summary: List configured vaults
      responses:
        "200":
          description: Vault settings, ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createVault
      summary: Create an empty vault or copy an existing vault database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultRequest"
      responses:
        "201":
          description: Created vault settings. The active vault is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Settings]
      operationId: updateVault
      summary: Update a vault's display name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVaultRequest"
      responses:
        "200":
          description: Updated vault settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteVault
      summary: Remove an inactive vault from the registry
      description: The database, mirror, and modify files are retained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteVaultRequest"
      responses:
        "204":
          description: Vault removed from the registry.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The vault is active or is the last configured vault.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/r2-vaults:
    get:
      tags: [Settings]
      operationId: listR2Vaults
      summary: List vault databases available in R2
      responses:
        "200":
          description: Root-level SQLite database names without their extensions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  minLength: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: downloadR2Vault
      summary: Download an R2 database as a new local vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadR2VaultRequest"
      responses:
        "201":
          description: Downloaded vault settings. The active vault is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/providers:
    get:
      tags: [Settings]
      operationId: listProviders
      summary: List inference providers
      responses:
        "200":
          description: Provider summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderSummary"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createProvider
      summary: Create an inference provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderRequest"
      responses:
        "201":
          description: Created provider settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/providers/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags: [Settings]
      operationId: getProvider
      summary: Get inference provider settings
      responses:
        "200":
          description: Provider settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Settings]
      operationId: updateProvider
      summary: Replace editable inference provider settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteProvider
      summary: Delete an unused inference provider
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Provider deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A character still uses this provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/providers/{provider_id}/test:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags: [Settings]
      operationId: testProvider
      summary: Test candidate settings with a basic inference request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "204":
          description: Provider responded successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/styles:
    get:
      tags: [Settings]
      operationId: listStyles
      summary: List character styles
      responses:
        "200":
          description: Style settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StyleDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createStyle
      summary: Create a character style
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStyleRequest"
      responses:
        "201":
          description: Created style settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/styles/{style_id}:
    parameters:
      - name: style_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    patch:
      tags: [Settings]
      operationId: updateStyle
      summary: Replace editable character style settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleUpdate"
      responses:
        "200":
          description: Updated style settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteStyle
      summary: Delete an unused character style
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Style deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A character still uses this style.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voices:
    get:
      tags: [Settings]
      operationId: listVoices
      summary: List speech voices
      responses:
        "200":
          description: Voice settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createVoice
      summary: Register a speech voice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoiceRequest"
      responses:
        "201":
          description: Created voice settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voices/{voice_id}:
    parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    patch:
      tags: [Settings]
      operationId: updateVoice
      summary: Replace editable speech voice settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceUpdate"
      responses:
        "200":
          description: Updated voice settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteVoice
      summary: Delete an unused speech voice
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Voice deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A character still uses this voice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voice-input:
    get:
      tags: [Settings]
      operationId: getVoiceInputSettings
      summary: Get voice input settings from the active vault
      responses:
        "200":
          description: Voice input settings, or null when not configured.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VoiceInputSettings"
                  - type: "null"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Settings]
      operationId: saveVoiceInputSettings
      summary: Save voice input settings in the active vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceInputSettings"
      responses:
        "200":
          description: Saved voice input settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceInputSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voice-input/runtime:
    get:
      tags: [Settings]
      operationId: getVoiceInputRuntime
      summary: Get resolved voice input settings
      responses:
        "200":
          description: Resolved settings, or null when voice input is not configured.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VoiceInputRuntime"
                  - type: "null"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voice-output:
    get:
      tags: [Settings]
      operationId: getVoiceOutputSettings
      summary: Get voice output settings from the active vault
      responses:
        "200":
          description: Voice output settings, or null when not configured.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VoiceOutputSettings"
                  - type: "null"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Settings]
      operationId: saveVoiceOutputSettings
      summary: Save voice output settings in the active vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceOutputSettings"
      responses:
        "200":
          description: Saved voice output settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceOutputSettings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voice-output/runtime:
    get:
      tags: [Settings]
      operationId: getVoiceOutputRuntime
      summary: Get resolved voice output settings
      responses:
        "200":
          description: Resolved settings, or null when voice output is not configured.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/VoiceOutputRuntime"
                  - type: "null"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voice-output/audio:
    post:
      tags: [Settings]
      operationId: generateFishAudio
      summary: Generate uncached FishAudio preview speech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, reference_id]
              properties:
                text:
                  type: string
                  minLength: 1
                reference_id:
                  type: string
                  minLength: 1
                settings:
                  type: object
                  properties:
                    speed:
                      type: number
                      minimum: 0.5
                      maximum: 2
      responses:
        "200":
          description: Generated preview audio.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/ogg:
              schema:
                type: string
                format: binary
            audio/opus:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        default:
          description: FishAudio or transport error.
          content:
            application/json:
              schema:
                type: object

  /api/v1/api-keys:
    get:
      tags: [Settings]
      operationId: listApiKeys
      summary: List saved API keys without their secret values
      responses:
        "200":
          description: Saved key metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createApiKey
      summary: Store a new API key locally
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Stored key metadata. The value is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/api-keys/{api_key_id}:
    parameters:
      - name: api_key_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    patch:
      tags: [Settings]
      operationId: renameApiKey
      summary: Rename a saved API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameApiKeyRequest"
      responses:
        "200":
          description: Updated key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteApiKey
      summary: Remove a saved API key
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: API key removed.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/api-keys/{api_key_id}/value:
    parameters:
      - name: api_key_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    put:
      tags: [Settings]
      operationId: replaceApiKeyValue
      summary: Replace a saved API key value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceApiKeyValueRequest"
      responses:
        "200":
          description: Updated key metadata. The value is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/r2-storage:
    get:
      tags: [Settings]
      operationId: getR2Storage
      summary: Get R2 storage credentials without the secret key
      responses:
        "200":
          description: Stored R2 metadata, or null when R2 is not configured.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/R2StorageDetail"
                  - type: "null"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Settings]
      operationId: saveR2Storage
      summary: Create or update R2 storage credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveR2StorageRequest"
      responses:
        "200":
          description: Stored R2 metadata. The secret key is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/R2StorageDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
