openapi: 3.1.0
info:
  title: CHA Web API
  version: 1.0.0
  description: |
    HTTP and server-sent event interface exposed by `chaweb`.

    `/` and `/s/{forum_id}/{session_id}/` serve the same client-routed HTML
    shell. Discovery and stored-session operations use root-scoped `/api/v1`
    routes. Operations on an open session are scoped beneath
    `/s/{forum_id}/{session_id}/api/v1`.

    The API has no authentication mechanism. Transcript attribution uses the
    session's persona, which comes from its forum configuration. JSON mutations
    that include an `Origin` header require that origin's authority to equal
    `Host`.
servers:
  - url: http://{host}:{port}
    description: Locally configured CHA web listener
    variables:
      host:
        default: 127.0.0.1
      port:
        default: "8080"

tags:
  - name: Shell
  - name: Service
  - name: Discovery
  - name: Settings
  - name: OpenAI
  - name: Stored sessions
  - name: Live sessions

paths:
  /:
    get:
      tags: [Shell]
      operationId: getShell
      summary: Get the browser application shell
      description: |
        Returns the single client-routed HTML document. The browser loads its
        state from `/api/v1/bootstrap` and routes between conversations itself
        without requesting another document.
      responses:
        "200":
          $ref: "#/components/responses/Shell"
        "500":
          $ref: "#/components/responses/InternalError"

  /s/{forum_id}/{session_id}/:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Shell]
      operationId: getSessionShell
      summary: Get the shell for a session deep link
      description: |
        Returns the same document as `/`. The trailing slash is required.

        The identifiers are neither validated nor resolved here: an unknown,
        malformed, or unopened session still receives the shell with status 200.
        The browser reads them from its own location and opens the session
        through `POST /api/v1/forums/{forum_id}/sessions/{session_id}/open`.
      responses:
        "200":
          $ref: "#/components/responses/Shell"
        "500":
          $ref: "#/components/responses/InternalError"

  /health:
    get:
      tags: [Service]
      operationId: getHealth
      summary: Check service readiness
      responses:
        "200":
          description: The server is ready to accept requests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/bootstrap:
    get:
      tags: [Discovery]
      operationId: getBootstrap
      summary: Get initial navigation and discovery state
      description: |
        Returns the initial forum and character rosters, including each forum's
        fixed persona, and all recent sessions ordered newest first.

        The character and forum rosters come from the published workspace.
        Sessions are read from storage on every request, so `recent_sessions`
        includes sessions created after the workspace was published.
      responses:
        "200":
          description: Bootstrap state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vault/switch:
    post:
      tags: [Service]
      operationId: switchVault
      summary: Switch the active vault
      description: |
        Switches the shared process-wide vault. The name is matched
        ASCII-case-insensitively against the configured registry. Success is
        `204` after the operation completes, including when the requested
        vault is already active. The HTTP listener and port do not change.

        After success the initiating page reloads `/` in the target vault.
        `Cache-Control` is `no-store`, including error responses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VaultSwitchRequest"
      responses:
        "204":
          description: The vault is now the requested vault, or already was.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/vaults:
    get:
      tags: [Settings]
      operationId: listVaults
      summary: List configured vaults
      responses:
        "200":
          description: Vault settings, ordered by display name.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VaultDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createVault
      summary: Create an empty vault or copy an existing vault database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVaultRequest"
      responses:
        "201":
          description: Created vault settings. The active vault is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Settings]
      operationId: updateVault
      summary: Update a vault's display name and optional paths
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateVaultRequest"
      responses:
        "200":
          description: Updated vault settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteVault
      summary: Remove an inactive vault from the registry
      description: The database, mirror, and modify files are retained.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteVaultRequest"
      responses:
        "204":
          description: Vault removed from the registry.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The vault is active or is the last configured vault.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/r2-vaults:
    get:
      tags: [Settings]
      operationId: listR2Vaults
      summary: List vault databases available in R2
      responses:
        "200":
          description: Root-level SQLite database names without their extensions.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                  minLength: 1
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: downloadR2Vault
      summary: Download an R2 database as a new local vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DownloadR2VaultRequest"
      responses:
        "201":
          description: Downloaded vault settings. The active vault is unchanged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/providers:
    get:
      tags: [Settings]
      operationId: listProviders
      summary: List inference providers
      responses:
        "200":
          description: Provider summaries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderSummary"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createProvider
      summary: Create an inference provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProviderRequest"
      responses:
        "201":
          description: Created provider settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/providers/{provider_id}:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    get:
      tags: [Settings]
      operationId: getProvider
      summary: Get inference provider settings
      responses:
        "200":
          description: Provider settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Settings]
      operationId: updateProvider
      summary: Replace editable inference provider settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "200":
          description: Updated provider settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteProvider
      summary: Delete an unused inference provider
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Provider deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A character still uses this provider.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/providers/{provider_id}/test:
    parameters:
      - name: provider_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    post:
      tags: [Settings]
      operationId: testProvider
      summary: Test candidate settings with a basic inference request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderUpdate"
      responses:
        "204":
          description: Provider responded successfully.
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/styles:
    get:
      tags: [Settings]
      operationId: listStyles
      summary: List character styles
      responses:
        "200":
          description: Style settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StyleDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createStyle
      summary: Create a character style
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStyleRequest"
      responses:
        "201":
          description: Created style settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/styles/{style_id}:
    parameters:
      - name: style_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    patch:
      tags: [Settings]
      operationId: updateStyle
      summary: Replace editable character style settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StyleUpdate"
      responses:
        "200":
          description: Updated style settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StyleDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteStyle
      summary: Delete an unused character style
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Style deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A character still uses this style.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voices:
    get:
      tags: [Settings]
      operationId: listVoices
      summary: List speech voices
      responses:
        "200":
          description: Voice settings.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VoiceDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createVoice
      summary: Register a speech voice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateVoiceRequest"
      responses:
        "201":
          description: Created voice settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/voices/{voice_id}:
    parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    patch:
      tags: [Settings]
      operationId: updateVoice
      summary: Replace editable speech voice settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoiceUpdate"
      responses:
        "200":
          description: Updated voice settings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoiceDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteVoice
      summary: Delete an unused speech voice
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Voice deleted.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A character still uses this voice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/api-keys:
    get:
      tags: [Settings]
      operationId: listApiKeys
      summary: List saved API keys without their secret values
      responses:
        "200":
          description: Saved key metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApiKeyDetail"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      tags: [Settings]
      operationId: createApiKey
      summary: Store a new API key locally
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateApiKeyRequest"
      responses:
        "201":
          description: Stored key metadata. The value is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/api-keys/{api_key_id}:
    parameters:
      - name: api_key_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    patch:
      tags: [Settings]
      operationId: renameApiKey
      summary: Rename a saved API key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameApiKeyRequest"
      responses:
        "200":
          description: Updated key metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteApiKey
      summary: Remove a saved API key
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: API key removed.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/api-keys/{api_key_id}/value:
    parameters:
      - name: api_key_id
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/Identifier"
    put:
      tags: [Settings]
      operationId: replaceApiKeyValue
      summary: Replace a saved API key value
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceApiKeyValueRequest"
      responses:
        "200":
          description: Updated key metadata. The value is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiKeyDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/r2-storage:
    get:
      tags: [Settings]
      operationId: getR2Storage
      summary: Get R2 storage credentials without the secret key
      responses:
        "200":
          description: Stored R2 metadata, or null when R2 is not configured.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/R2StorageDetail"
                  - type: "null"
        "500":
          $ref: "#/components/responses/InternalError"
    put:
      tags: [Settings]
      operationId: saveR2Storage
      summary: Create or update R2 storage credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveR2StorageRequest"
      responses:
        "200":
          description: Stored R2 metadata. The secret key is never returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/R2StorageDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags: [Settings]
      operationId: deleteR2Storage
      summary: Remove R2 storage credentials
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: R2 storage credentials removed.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/openai/auth:
    get:
      tags: [OpenAI]
      operationId: getOpenAiAuth
      summary: Get the ChatGPT connection snapshot
      description: |
        Returns displayable connection status only. This read does not call
        OpenAI. A `waiting` snapshot is enough for the browser to resume an
        unexpired device login after a page reload.

        The snapshot never includes tokens, account IDs, email, device IDs,
        authorization codes, or verifiers. `Cache-Control` is `no-store`.
      responses:
        "200":
          $ref: "#/components/responses/OpenAiAuth"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/openai/auth/login:
    post:
      tags: [OpenAI]
      operationId: startOpenAiAuth
      summary: Start or resume ChatGPT device login
      description: |
        Starts one workspace device login, or returns the current pending
        attempt. A connected account must be disconnected first. The request
        body is `{}`. `Cache-Control` is `no-store`, including error responses.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/OpenAiAuth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/openai/auth/poll:
    post:
      tags: [OpenAI]
      operationId: pollOpenAiAuth
      summary: Poll the pending ChatGPT device login once
      description: |
        Performs at most one eligible owner poll. An early request returns the
        current snapshot without calling OpenAI. The request body is `{}`.
        `next_poll_delay_ms` is the wait the browser can pass to `setTimeout`.
        `Cache-Control` is `no-store`, including error responses.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/OpenAiAuth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/openai/auth/disconnect:
    post:
      tags: [OpenAI]
      operationId: disconnectOpenAiAuth
      summary: Cancel pending login or disconnect ChatGPT
      description: |
        Cancels a pending device login or disconnects the saved account and
        removes the private credential file. The request body is `{}`.
        `Cache-Control` is `no-store`, including error responses.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/OpenAiAuth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/characters:
    post:
      tags: [Discovery]
      operationId: createCharacter
      summary: Create a draft character
      description: |
        Creates a writable character with a generated stable identifier, an
        empty `PROFILE.md`, and a fixed `CHARACTER.md` wrapper that includes
        the application's shared character-voice instructions. A provider and
        style are deliberately left unset; the character cannot be used by a
        forum until a provider is selected. If the shared voice file is absent
        from an older vault, character creation installs it without replacing
        an existing customized copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "201":
          description: The new draft character.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/characters/{character_id}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    get:
      tags: [Discovery]
      operationId: getCharacter
      summary: Get character details
      description: |
        Returns the character summary, its template-expanded Markdown
        definition, and the settings the editor needs. The built-in Assistant
        returns the embedded application guide and is not writable.
      responses:
        "200":
          description: Character details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Discovery]
      operationId: updateCharacter
      summary: Update character settings
      description: |
        Rewrites `provider`, `style`, `reasoning_effort`, and `web_search` in the
        character's `character.toml`. Provider is required; `null` erases the
        corresponding optional key so the provider default applies. A setting
        whose config does not load is `400` and leaves the file untouched. The
        built-in Assistant, a missing character, and a character whose file
        cannot be read are `404`.

        After a write that actually changes a value, the server asks live
        sessions in every forum containing the character to shut down with
        `reloading`. The server does not reopen anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCharacterRequest"
      responses:
        "200":
          description: Character details after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Discovery]
      operationId: deleteCharacter
      summary: Delete an unused character
      description: |
        Permanently removes a writable character and its definition. A
        character that is still a member of a forum cannot be deleted.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
