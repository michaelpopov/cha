      required: [display_name, url, access_key_id, secret_key]
      properties:
        display_name:
          type: string
        url:
          type: string
        access_key_id:
          type: string
        secret_key:
          description: Null keeps the existing secret key; creating requires a value.
          type: [string, "null"]

    StyleOption:
      type: object
      additionalProperties: false
      required: [id, label, appearance]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string
        appearance:
          $ref: "#/components/schemas/CharacterAppearance"

    VoiceOption:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string

    CharacterDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - display_name
        - appearance
        - character_markdown
        - editable_markdown
        - provider
        - style
        - voice_id
        - reasoning_effort
        - web_search
        - available_providers
        - available_styles
        - available_voices
        - writable
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        appearance:
          $ref: "#/components/schemas/CharacterAppearance"
        voice:
          $ref: "#/components/schemas/SpeechVoice"
        character_markdown:
          type: string
          description: Template-expanded Markdown used for display.
        editable_markdown:
          type: string
          description: Verbatim Markdown accepted by the definition editor.
        provider:
          type: [string, "null"]
        style:
          type: [string, "null"]
        voice_id:
          type: [string, "null"]
        reasoning_effort:
          type: [string, "null"]
          enum: [low, medium, high, xhigh, null]
        web_search:
          type: [string, "null"]
          enum: [off, auto, required, null]
        available_providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderOption"
        available_styles:
          type: array
          items:
            $ref: "#/components/schemas/StyleOption"
        available_voices:
          type: array
          items:
            $ref: "#/components/schemas/VoiceOption"
        writable:
          type: boolean

    CreateCharacterRequest:
      type: object
      additionalProperties: false
      required: [display_name, description]
      properties:
        display_name:
          type: string
        description:
          type: string

    UpdateCharacterRequest:
      type: object
      additionalProperties: false
      required: [provider, style, voice_id, reasoning_effort, web_search]
      properties:
        provider:
          type: string
        style:
          type: [string, "null"]
        voice_id:
          type: [string, "null"]
        reasoning_effort:
          type: [string, "null"]
          enum: [low, medium, high, xhigh, null]
        web_search:
          type: [string, "null"]
          enum: [off, auto, required, null]

    UpdateCharacterDefinitionRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
        character_markdown:
          type: string

    PersonaDetail:
      type: object
      additionalProperties: false
      required: [id, display_name, persona_markdown, writable]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        persona_markdown:
          type: string
        writable:
          type: boolean

    UpdatePersonaRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
        persona_markdown:
          type: string

    CreatePersonaRequest:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name:
          type: string

    ForumDetail:
      type: object
      additionalProperties: false
      required: [id, display_name, default_character_id, default_persona_id, default_persona_display_name, members, forum_markdown, writable]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        default_character_id:
          $ref: "#/components/schemas/Identifier"
        default_persona_id:
          $ref: "#/components/schemas/Identifier"
        default_persona_display_name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"
        forum_markdown:
          type: string
        writable:
          type: boolean

    CreateForumRequest:
      type: object
      additionalProperties: false
      required: [display_name, persona_id]
      properties:
        display_name:
          type: string
        persona_id:
          $ref: "#/components/schemas/Identifier"

    UpdateForumRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        display_name:
          type: string
        forum_markdown:
          type: string

    UpdateForumMembersRequest:
      type: object
      additionalProperties: false
      required: [character_ids, persona_id]
      properties:
        character_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Identifier"
        persona_id:
          $ref: "#/components/schemas/Identifier"

    CreateSessionRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          maxLength: 200

    RenameSessionRequest:
      type: object
      additionalProperties: false
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200

    CreateSessionResult:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string

    SessionLabelResult:
      type: object
      additionalProperties: false
      required: [id, label]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        label:
          type: string

    OpenSessionResult:
      type: object
      additionalProperties: false
      required: [forum_id, session_id]
      properties:
        forum_id:
          $ref: "#/components/schemas/Identifier"
        session_id:
          $ref: "#/components/schemas/Identifier"

    InputRequest:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
          description: Input text, limited by the server's configured prompt byte limit.

    CoverRequest:
      type: object
      additionalProperties: false
      required: [through_entry_id]
      properties:
        through_entry_id:
          type: integer
          minimum: 1

    DeleteTurnRequest:
      type: object
      additionalProperties: false
      required: [response_entry_id]
      properties:
        response_entry_id:
          type: integer
          minimum: 1

    SetDefaultCharacterRequest:
      type: object
      additionalProperties: false
      required: [character_id]
      properties:
        character_id:
          type: string
          minLength: 1

    CommandResult:
      type: object
      additionalProperties: false
      required: [clear_input]
      properties:
        clear_input:
          type: boolean
        notice:
          type: string

    TranscriptEntry:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - participant_id
        - display_name
        - addressed_to
        - addressed_to_name
        - text
        - status
        - created_at
      properties:
        id:
          $ref: "#/components/schemas/UnsignedInteger"
        kind:
          type: string
          enum: [human, character, notice, error]
        participant_id:
          type: string
        display_name:
          type: string
        addressed_to:
          type: string
        addressed_to_name:
          type: string
        text:
          type: string
        status:
          type: string
          enum: [complete, streaming, cancelled, failed]
        request_id:
          $ref: "#/components/schemas/UnsignedInteger"
        created_at:
          description: Unix seconds when the entry was created; null when unknown (rows stored before schema version 3).
          type: [integer, "null"]

    GenerationState:
      type: object
      additionalProperties: false
      required: [active, character_id, character_display_name, phase, reasoning_text]
      properties:
        active:
          type: boolean
        request_id:
          $ref: "#/components/schemas/UnsignedInteger"
        character_id:
          type: string
        character_display_name:
          type: string
        phase:
          type: string
          enum: [waiting, reasoning, answering, stopping]
        reasoning_text:
          type: string

    SessionSnapshot:
      type: object
      additionalProperties: false
      required:
        - forum
        - session_id
        - session_label
        - characters
        - default_character_id
        - transcript
        - generation
        - lifecycle
      properties:
        forum:
          $ref: "#/components/schemas/ForumSummary"
        session_id:
          $ref: "#/components/schemas/Identifier"
        session_label:
          type: string
        characters:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"
        default_character_id:
          $ref: "#/components/schemas/Identifier"
        transcript:
          type: array
          items:
            $ref: "#/components/schemas/TranscriptEntry"
        covered_until:
          $ref: "#/components/schemas/UnsignedInteger"
        generation:
          $ref: "#/components/schemas/GenerationState"
        notice:
          type: string
        lifecycle:
          type: string
          enum: [starting, running, stopping]
        shutdown_reason:
          type: string
          enum: [browser_disconnected, reloading, session_failed, session_deleted, server_stopping]

    AppendTargetEntry:
      type: object
      additionalProperties: false
      required: [kind, entry_id]
      properties:
        kind:
          type: string
          const: entry
        entry_id:
          $ref: "#/components/schemas/UnsignedInteger"

    AppendTargetReasoning:
      type: object
      additionalProperties: false
      required: [kind, request_id]
      properties:
        kind:
          type: string
          const: reasoning
        request_id:
          $ref: "#/components/schemas/UnsignedInteger"

    AppendTarget:
      oneOf:
        - $ref: "#/components/schemas/AppendTargetEntry"
        - $ref: "#/components/schemas/AppendTargetReasoning"
      discriminator:
        propertyName: kind
        mapping:
          entry: "#/components/schemas/AppendTargetEntry"
          reasoning: "#/components/schemas/AppendTargetReasoning"

    AppendEvent:
      type: object
      additionalProperties: false
      required: [target, text, seq]
      properties:
        target:
          $ref: "#/components/schemas/AppendTarget"
        text:
          type: string
        seq:
          $ref: "#/components/schemas/UnsignedInteger"

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - not_found
                - bad_request
                - body_too_large
                - prompt_too_large
                - forbidden_origin
                - internal_error
                - session_stopping
                - session_limit_reached
                - session_open_timeout
                - server_stopping
                - session_not_live
                - command_timeout
                - command_queue_full
            message:
              type: string

    UnixTimestamp:
      type: integer
      format: int64
      description: Whole seconds since the Unix epoch.

    UnsignedInteger:
      type: integer
      minimum: 0
