  /api/v1/forums/{forum_id}/sessions/{session_id}/open:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Stored sessions]
      operationId: openSession
      summary: Open or reattach to a session
      description: |
        Starts the session's live runtime, or reattaches to its existing runtime.
        On success, live-session operations become available beneath the session's
        `/s/{forum_id}/{session_id}/api/v1` path.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          description: Session is open.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenSessionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            The session's previous runtime is still shutting down.
            `error.code` is `session_stopping`, and the request can be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: |
            Session limit, open timeout, or server shutdown prevented opening.
            `error.code` is `session_limit_reached`, `session_open_timeout`, or
            `server_stopping`. On `session_open_timeout` the session may still
            finish opening, so the request can be retried.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/forums/{forum_id}/sessions/{session_id}/download:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Stored sessions]
      operationId: downloadSession
      summary: Download a session transcript as Markdown
      description: |
        Returns the current transcript of a stored or live session. A live
        session is read through its owner so the export includes its latest
        in-memory content without changing which session the browser has open.
      responses:
        "200":
          description: Markdown session transcript.
          content:
            text/markdown:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The stored session is busy or the live session stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: The session command timed out or its queue was full.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/forums/{forum_id}/sessions/{session_id}/entries/{entry_id}/audio-download:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
      - name: entry_id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
    post:
      tags: [Stored sessions]
      operationId: startAudioDownload
      summary: Queue transcript audio for background generation and storage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioDownloadRequest"
      responses:
        "200":
          description: Audio is already cached.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AudioDownloadAcceptance"}
        "202":
          description: New or existing background job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AudioDownloadAcceptance"}
        "409":
          description: Active vault changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "503":
          description: Downloads are temporarily unavailable during maintenance or cache clearing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        default:
          description: Invalid request or unavailable entry/configuration.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /api/v1/forums/{forum_id}/sessions/{session_id}/audio-downloads:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      parameters:
        - name: vault_name
          in: query
          required: true
          schema: {type: string, minLength: 1}
      tags: [Stored sessions]
      operationId: getAudioDownloads
      summary: Read cached audio IDs and background job states without opening the session
      responses:
        "200":
          description: Current audio availability and jobs. Both lists are empty when this runtime has no audio downloads.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AudioDownloadStatus"}
        default:
          description: Unavailable session, changed vault, or temporary maintenance.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

    post:
      tags: [Stored sessions]
      operationId: startAudioDownloadBatch
      summary: Accept a batch of transcript entries into the background audio queue
      description: Prepares all entries before admitting new jobs. Acceptance does not wait for generation or storage. A lost response can be reconciled by reading status; resubmission deduplicates existing jobs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AudioDownloadBatchRequest"}
      responses:
        "202":
          description: Each entry is cached or has a new or existing background job.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AudioDownloadBatchAcceptance"}
        "409":
          description: Active vault changed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "503":
          description: Downloads are temporarily unavailable during maintenance or cache clearing.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        default:
          description: Invalid request or unavailable entry/configuration; no new jobs from this batch were admitted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /api/v1/forums/{forum_id}/sessions/{session_id}/entries/{entry_id}/audio:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
      - name: entry_id
        in: path
        required: true
        schema: {type: integer, minimum: 1}
      - name: vault_name
        in: query
        required: true
        schema: {type: string, minLength: 1}
    get:
      tags: [Stored sessions]
      operationId: getCachedAudio
      summary: Fetch committed audio without starting generation
      responses:
        "200":
          description: Cached audio.
          content:
            audio/mpeg:
              schema: {type: string, format: binary}
            audio/wav:
              schema: {type: string, format: binary}
            audio/ogg:
              schema: {type: string, format: binary}
            audio/opus:
              schema: {type: string, format: binary}
        default:
          description: Cache missing, changed vault, or temporary maintenance.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}

  /api/v1/forums/{forum_id}/sessions/{session_id}/audio-cache:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    delete:
      tags: [Stored sessions]
      operationId: clearSessionAudioCache
      summary: Clear all cached audio for a session
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Cached audio deleted; the session transcript is unchanged.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          description: Audio cache clearing is temporarily unavailable; error code speech_busy.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/forums/{forum_id}/sessions/{session_id}:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    patch:
      tags: [Stored sessions]
      operationId: renameSession
      summary: Rename a stored or live session
      description: |
        Replaces the session's display label. The stable session ID never
        changes, so existing deep links stay valid.

        The label must be valid UTF-8, contain at most 200 Unicode code points,
        contain no control characters or line breaks, and have no leading or
        trailing Unicode whitespace. Unlike creation, an empty label has no
        generated-ID fallback and answers `400` with `bad_request`.

        A session with a live runtime is renamed through its owner, so the
        database, the current snapshot, and every event-stream consumer observe
        the same label. That path also reports the owner-queue failures:
        `command_queue_full`, `command_timeout`, and `session_not_live`. A
        `command_timeout` leaves the outcome unknown, because the owner may
        still commit the rename after the request has given up.

        The built-in Welcome session is process-local and cannot be renamed; it
        answers `404` with `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameSessionRequest"
      responses:
        "200":
          description: Session renamed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionLabelResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The live session is no longer available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"
    delete:
      tags: [Stored sessions]
      operationId: deleteSession
      summary: Delete a session
      description: |
        Deletes the session and its transcript from the workspace database, so
        it stops listing, stops opening, and answers `404` afterwards.

        A session with a live runtime is stopped first, and its final snapshot
        carries the `session_deleted` shutdown reason. If that shutdown does not
        finish within the server's deletion deadline the session remains active
        and the request answers `409` with `session_stopping`;
        the shutdown may still complete, so a later delete can succeed.

        The built-in Welcome session is process-local and cannot be deleted; it
        answers `404` with `not_found` without stopping its runtime.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Session deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Session is stopping.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Server shutdown prevented deletion.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /s/{forum_id}/{session_id}/api/v1/session:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Live sessions]
      operationId: getSessionSnapshot
      summary: Get the authoritative live-session snapshot
      responses:
        "200":
          description: Current session state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/events:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Live sessions]
      operationId: streamSessionEvents
      summary: Stream live-session updates
      description: |
        Opens the session's single Server-Sent Events connection. CHA serves
        one reader, who may move between devices, so this connection always
        succeeds and displaces whichever one was open before. The displaced
        stream receives a final `superseded` event and ends; a browser that
        receives it stops following the session rather than reconnecting,
        because reconnecting would take the session back.

        The first record is a `snapshot` event whose JSON data is a
        `SessionSnapshot`. Later records are either replacement `snapshot`
        events or `append` events whose JSON data is an `AppendEvent`.
        Comment-only `: heartbeat` records keep an idle connection alive.

        `Last-Event-ID` is ignored; reconnecting starts with a fresh snapshot.
      responses:
        "200":
          description: |
            SSE stream containing `snapshot` and `append` events. Event data is
            one compact JSON value on the `data:` line.
          x-sse-events:
            snapshot:
              payload:
                $ref: "#/components/schemas/SessionSnapshot"
            append:
              payload:
                $ref: "#/components/schemas/AppendEvent"
            superseded:
              description: |
                Final record of a stream another device has taken over. Its
                data is an empty JSON object.
            heartbeat:
              description: "Comment-only `: heartbeat` record with no data payload."
          headers:
            Cache-Control:
              schema:
                type: string
                const: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                const: "no"
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                snapshot:
                  summary: Initial event shape
                  value: |-
                    event: snapshot
                    data: {"forum":{"id":"lobby","display_name":"Lobby","default_character_id":"guide","default_persona_id":"builtin-guest","default_persona_display_name":"Guest","members":[]},"session_id":"one","session_label":"One","characters":[],"default_character_id":"guide","transcript":[],"generation":{"active":false,"character_id":"","character_display_name":"","phase":"waiting","reasoning_text":""},"lifecycle":"running"}
                append:
                  summary: Incremental transcript append
                  value: |-
                    event: append
                    data: {"target":{"kind":"entry","entry_id":1},"text":" more text","seq":0}

        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Session is not live. `error.code` is `session_not_live`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/input:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Live sessions]
      operationId: submitInput
      summary: Submit user input
      description: |
        Submits text through the session's shared input path using the fixed
        persona configured for the session's forum.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InputRequest"
      responses:
        "200":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "413":
          description: |
            Request body or prompt text exceeds its configured limit.
            `error.code` is `body_too_large` for the whole request body, or
            `prompt_too_large` for the `text` field alone.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/actions/stop:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Live sessions]
      operationId: stopGeneration
      summary: Request that generation stop
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/actions/cover:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Live sessions]
      operationId: coverConversation
      summary: Cover the transcript through an entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoverRequest"
      responses:
        "200":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/actions/uncover:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Live sessions]
      operationId: uncoverConversation
      summary: Uncover the transcript
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/CommandAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/SessionNotLive"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/CommandUnavailable"

  /s/{forum_id}/{session_id}/api/v1/actions/delete-turn:
    parameters:
      - $ref: "#/components/parameters/ForumId"
      - $ref: "#/components/parameters/SessionId"
    post:
      tags: [Live sessions]
      operationId: deleteTurn
      summary: Delete a response and its prompt
      requestBody:
        required: true
