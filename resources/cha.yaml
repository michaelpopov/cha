          description: R2 storage credentials removed.
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/openai/auth:
    get:
      tags: [OpenAI]
      operationId: getOpenAiAuth
      summary: Get the ChatGPT connection snapshot
      description: |
        Returns displayable connection status only. This read does not call
        OpenAI. A `waiting` snapshot is enough for the browser to resume an
        unexpired device login after a page reload.

        The snapshot never includes tokens, account IDs, email, device IDs,
        authorization codes, or verifiers. `Cache-Control` is `no-store`.
      responses:
        "200":
          $ref: "#/components/responses/OpenAiAuth"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/openai/auth/login:
    post:
      tags: [OpenAI]
      operationId: startOpenAiAuth
      summary: Start or resume ChatGPT device login
      description: |
        Starts one workspace device login, or returns the current pending
        attempt. A connected account must be disconnected first. The request
        body is `{}`. `Cache-Control` is `no-store`, including error responses.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/OpenAiAuth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/openai/auth/poll:
    post:
      tags: [OpenAI]
      operationId: pollOpenAiAuth
      summary: Poll the pending ChatGPT device login once
      description: |
        Performs at most one eligible owner poll. An early request returns the
        current snapshot without calling OpenAI. The request body is `{}`.
        `next_poll_delay_ms` is the wait the browser can pass to `setTimeout`.
        `Cache-Control` is `no-store`, including error responses.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/OpenAiAuth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/openai/auth/disconnect:
    post:
      tags: [OpenAI]
      operationId: disconnectOpenAiAuth
      summary: Cancel pending login or disconnect ChatGPT
      description: |
        Cancels a pending device login or disconnects the saved account and
        removes the private credential file. The request body is `{}`.
        `Cache-Control` is `no-store`, including error responses.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "200":
          $ref: "#/components/responses/OpenAiAuth"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/characters:
    post:
      tags: [Discovery]
      operationId: createCharacter
      summary: Create a draft character
      description: |
        Creates a writable character with a generated stable identifier, an
        empty `PROFILE.md`, and a fixed `CHARACTER.md` wrapper that includes
        the application's shared character-voice instructions. A provider and
        style are deliberately left unset; the character cannot be used by a
        forum until a provider is selected. If the shared voice file is absent
        from an older vault, character creation installs it without replacing
        an existing customized copy.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCharacterRequest"
      responses:
        "201":
          description: The new draft character.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/characters/{character_id}:
    parameters:
      - $ref: "#/components/parameters/CharacterId"
    get:
      tags: [Discovery]
      operationId: getCharacter
      summary: Get character details
      description: |
        Returns the character summary, its template-expanded Markdown
        definition, and the settings the editor needs. The built-in Assistant
        returns the embedded application guide; its settings are writable but
        its name and definition are not.
      responses:
        "200":
          description: Character details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Discovery]
      operationId: updateCharacter
      summary: Update character settings
      description: |
        Rewrites `provider`, `style`, `voice`, `reasoning_effort`, and
        `web_search` in the character's `character.toml`. Provider is required;
        `null` erases the
        corresponding optional key so the provider default applies. A setting
        whose config does not load is `400` and leaves the file untouched. A
        missing character and a character whose file cannot be read are `404`.

        After a write that actually changes a value, the server asks live
        sessions in every forum containing the character to shut down with
        `reloading`. The server does not reopen anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCharacterRequest"
      responses:
        "200":
          description: Character details after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CharacterDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      tags: [Discovery]
      operationId: deleteCharacter
      summary: Delete an unused character
      description: |
        Permanently removes a writable character and its definition. A
        character that is still a member of a forum cannot be deleted.
      requestBody:
        $ref: "#/components/requestBodies/EmptyJsonObject"
      responses:
        "204":
          description: Character deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: A forum still uses this character.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"

