components:
  parameters:
    ForumId:
      name: forum_id
      in: path
      required: true
      description: Stable URL-safe forum identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    SessionId:
      name: session_id
      in: path
      required: true
      description: Stable URL-safe session identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    CharacterId:
      name: character_id
      in: path
      required: true
      description: Stable URL-safe character identifier.
      schema:
        $ref: "#/components/schemas/Identifier"
    PersonaId:
      name: persona_id
      in: path
      required: true
      description: Stable URL-safe persona identifier.
      schema:
        $ref: "#/components/schemas/Identifier"

  requestBodies:
    EmptyJsonObject:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EmptyObject"

  responses:
    BadRequest:
      description: |
        Content type is not JSON, or the JSON body has an invalid shape.
        `error.code` is `bad_request`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenMutation:
      description: |
        Origin does not match Host. `error.code` is `forbidden_origin`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: |
        The route identifier or selected resource was not found.
        `error.code` is `not_found`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    SessionNotLive:
      description: |
        The selected session does not have a live runtime.
        `error.code` is `session_not_live`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    BodyTooLarge:
      description: |
        The JSON request body exceeds the configured size limit.
        `error.code` is `body_too_large`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: |
        The request failed unexpectedly.
        `error.code` is `internal_error`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Shell:
      description: The client-routed application document, served as UTF-8 HTML.
      content:
        text/html:
          schema:
            type: string
    CommandUnavailable:
      description: |
        The command queue is full, the command timed out, or the server is
        stopping. `error.code` is `command_queue_full`, `command_timeout`, or
        `server_stopping`. On `command_timeout` the command's outcome is
        unknown: it may still be applied.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CommandAccepted:
      description: Command completed at the live-session boundary.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/CommandResult"
    OpenAiAuth:
      description: |
        Displayable ChatGPT connection snapshot. Waiting is the only status
        that includes a user code, verification URL, attempt expiry, and
        next-poll delay.
      headers:
        Cache-Control:
          schema:
            type: string
            const: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/OpenAiAuth"
          examples:
            signed_out:
              summary: No ChatGPT account is connected
              value:
                status: signed_out
            waiting:
              summary: Device login in progress
              value:
                status: waiting
                user_code: TEST-ONLY
                verification_url: https://auth.openai.com/codex/device
                attempt_expires_at: 1700000900
                next_poll_delay_ms: 1000
            connected:
              summary: ChatGPT account is connected
              value:
                status: connected
            signed_out_with_error:
              summary: Login failed; reconnect is manual
              value:
                status: signed_out
                error: OpenAI login failed.

  schemas:
    Identifier:
      type: string
      minLength: 1
      pattern: "^(?!\\.{1,2}$)[A-Za-z0-9._~-]+$"
      examples: [lobby]

    EmptyObject:
      type: object
      additionalProperties: false

    OpenAiAuth:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [signed_out, waiting, connected]
        user_code:
          type: string
          description: |
            Present only while `status` is `waiting`. The code the user enters
            at the verification URL.
        verification_url:
          type: string
          format: uri
          description: |
            Present only while `status` is `waiting`. Always
            `https://auth.openai.com/codex/device`.
        attempt_expires_at:
          $ref: "#/components/schemas/UnixTimestamp"
          description: |
            Present only while `status` is `waiting`. Unix seconds when this
            pending login expires. The browser can compare with `Date.now()/1000`.
        next_poll_delay_ms:
          type: integer
          minimum: 0
          description: |
            Present only while `status` is `waiting`. Milliseconds until the
            next eligible `POST /api/v1/openai/auth/poll`. The browser can pass
            this value to `setTimeout`.
        error:
          type: string
          description: |
            Sanitized operator-facing message when the last owner operation
            failed. Omitted when there is no such message.

    Health:
      type: object
      additionalProperties: false
      required: [ready, live_session_count]
      properties:
        ready:
          type: boolean
          const: true
        live_session_count:
          type: integer
          minimum: 0

    PersonaSummary:
      type: object
      additionalProperties: false
      required: [id, display_name]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string

    CharacterAppearance:
      type: object
      additionalProperties: false
      description: |
        How the browser sets this character's words, so a reader can tell one
        speaker from another without reading every name. A closed vocabulary:
        the browser owns the actual typefaces, sizes, and colors and pairs each choice
        with a dark-mode variant, and a workspace cannot supply styling of its
        own. Always present, defaults included.
      required: [font, style, weight, size, text_color]
      properties:
        font:
          type: string
          enum: [sans, serif, mono]
        style:
          type: string
          enum: [normal, italic]
        weight:
          type: string
          enum: [light, normal, medium, semibold, bold]
        size:
          type: string
          enum: [small, normal, large]
        text_color:
          type: string
          enum: [normal, muted, accent]

    SpeechVoiceSettings:
      type: object
      additionalProperties: false
      properties:
        stability:
          type: number
          minimum: 0
          maximum: 1
        similarity_boost:
          type: number
          minimum: 0
          maximum: 1
        style:
          type: number
          minimum: 0
          maximum: 1
        use_speaker_boost:
          type: boolean
        speed:
          type: number
          minimum: 0.7
          maximum: 1.2

    SpeechVoice:
      type: object
      additionalProperties: false
      required: [id, display_name, elevenlabs_voice_id, settings]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        elevenlabs_voice_id:
          type: string
        settings:
          $ref: "#/components/schemas/SpeechVoiceSettings"

    CharacterSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, appearance]
      properties:
        id:
          $ref: "#/components/schemas/Identifier"
        display_name:
          type: string
        description:
          type: string
        appearance:
          $ref: "#/components/schemas/CharacterAppearance"
        voice:
          $ref: "#/components/schemas/SpeechVoice"

    ForumSummary:
      type: object
      additionalProperties: false
      required: [id, display_name, default_character_id, default_persona_id, default_persona_display_name, members]
      properties:
        id:
