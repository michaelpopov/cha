            application/json:
              schema:
                $ref: "#/components/schemas/ForumDetail"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags: [Discovery]
      operationId: updateForum
      summary: Update a forum
      description: |
        Updates the forum's display name, its `FORUM.md`, or both. Omitted
        fields are left unchanged. The built-in Entrance and missing forums
        are not writable.

        After a write that actually changes a value, the server asks live
        sessions in the forum to shut down with `reloading`. The server does
        not reopen anything.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateForumRequest"
      responses:
        "200":
          description: Forum details after the write.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ForumDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/ForbiddenMutation"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
