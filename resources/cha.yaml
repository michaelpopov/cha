        display_name:
          type: string
        description:
          type: string
        default_character_id:
          $ref: "#/components/schemas/Identifier"
        default_persona_id:
          $ref: "#/components/schemas/Identifier"
        default_persona_display_name:
          type: string
        members:
          type: array
          items:
            $ref: "#/components/schemas/CharacterSummary"

    SessionListing:
